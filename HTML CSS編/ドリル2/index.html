<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>CSSドリル２</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h3>左横並び</h3>
    <div class="flex-normal">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>両端よせ</h3>
    <div class="flex-sb">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>中央よせ</h3>
    <div class="flex-c">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>左よせ</h3>
    <div class="flex-l">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>右寄せ</h3>
    <div class="flex-r">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>上寄せ</h3>
    <div class="flex-align-st">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>下寄せ</h3>
    <div class="flex-align-ed">
      <p>要素1</p>
      <p>要素2</p>
    </div>
    <h3>縦方向中央寄せ</h3>
    <div class="flex-align-c">
      <p>要素1</p>
      <p>要素2</p>
    </div>
  </body>
</html>
